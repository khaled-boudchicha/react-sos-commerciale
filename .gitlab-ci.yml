# Gestion Commerciale Desktop — intégration continue & builds multi-plateformes.
#
# - Chaque push / MR : typecheck (renderer + Electron), tests unitaires et parcours d'interface (e2e/ui).
# - Tag vX.Y.Z : builds Windows (NSIS) + Linux (AppImage, deb) sur les images
#   officielles electron-builder, macOS (dmg + zip) sur un runner macOS (tag
#   `macos`, job manuel), puis dépôt des installateurs et des manifestes
#   latest*.yml dans le registre de paquets générique du projet.
#
# Variables CI à définir (Settings → CI/CD → Variables) :
#   GC_UPDATE_URL   URL publique du dossier des mises à jour, ex.
#                   https://api.druxamed.com/mises-a-jour/gestion-commerciale
#                   (active electron-updater dans les builds ; sans elle, pas d'auto-update)
#   GC_DEPLOY_HOST, GC_DEPLOY_USER, GC_DEPLOY_PATH   dépôt SSH sur le VPS, ex. PATH =
#                   /opt/sos-cloud-server/mises-a-jour/gestion-commerciale (servi par Caddy)
#   GC_DEPLOY_SSH_KEY (type « File »), GC_DEPLOY_KNOWN_HOSTS   clé de déploiement + empreinte
#   CSC_LINK, CSC_KEY_PASSWORD                    certificat de signature (Windows / macOS)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarisation macOS (à activer
#                   aussi dans app/package.json : build.mac.notarize — non fait tant qu'aucune identité n'existe)
# La version publiée est celle du tag (package.json est aligné avant le build).

stages: [check, build, publish]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

.npm: &npm
  before_script:
    - cd app
    - npm ci
  cache:
    key: { files: [app/package-lock.json] }
    paths: [.npm, .cache]

check:
  stage: check
  image: node:20
  <<: *npm
  script:
    - npm run typecheck
    - npx tsc -p tsconfig.electron.json --noEmit
    - TZ=Africa/Algiers npm test
    - TZ=Africa/Algiers npm run test:report

# Parcours d'interface (build de production + GraphQL simulé, aucun agent) : connexion, comptoir,
# anti-doublon, cache hors ligne, droits, garde de saisie. Image Playwright de la même version que la
# dépendance `playwright` (navigateurs fournis). Non bloquant tant qu'il n'a pas tourné sur GitLab.
ui:
  stage: check
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  <<: *npm
  allow_failure: true
  script:
    - npm run test:ui

# Application de bureau réelle (Electron sous écran virtuel) : sécurité du pont, stockage, CSP,
# rechargement après plantage, fenêtre. Non bloquant tant qu'il n'a pas tourné sur GitLab.
electron:
  stage: check
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  <<: *npm
  allow_failure: true
  script:
    - xvfb-run -a npm run test:electron

# Aligne la version de l'app sur le tag puis construit ; l'URL de mise à jour
# n'est injectée que si GC_UPDATE_URL est défini.
.build: &build
  stage: build
  <<: *npm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  artifacts:
    expire_in: 30 days
    paths:
      - app/release/*.exe
      - app/release/*.AppImage
      - app/release/*.deb
      - app/release/*.dmg
      - app/release/*.zip
      - app/release/*.blockmap
      - app/release/latest*.yml

build:linux:
  <<: *build
  image: electronuserland/builder:20
  script:
    - npm version --no-git-tag-version --allow-same-version "${CI_COMMIT_TAG#v}"
    - npm run build
    - npx electron-builder --linux --publish never ${GC_UPDATE_URL:+-c.publish.provider=generic -c.publish.url=$GC_UPDATE_URL}

build:windows:
  <<: *build
  image: electronuserland/builder:20-wine
  script:
    - npm version --no-git-tag-version --allow-same-version "${CI_COMMIT_TAG#v}"
    - npm run build
    - npx electron-builder --win --publish never ${GC_UPDATE_URL:+-c.publish.provider=generic -c.publish.url=$GC_UPDATE_URL}

build:macos:
  <<: *build
  tags: [macos]
  when: manual
  allow_failure: true
  script:
    - npm version --no-git-tag-version --allow-same-version "${CI_COMMIT_TAG#v}"
    - npm run build
    - npx electron-builder --mac --publish never ${GC_UPDATE_URL:+-c.publish.provider=generic -c.publish.url=$GC_UPDATE_URL}

# 1. Archive par version dans le registre de paquets générique du projet.
# 2. Dépôt sur le VPS (dossier servi publiquement par Caddy, lu par electron-updater) :
#    installeurs d'abord, manifestes latest*.yml en dernier — un poste ne doit jamais voir
#    une version annoncée dont le fichier n'est pas encore en ligne.
publish:
  stage: publish
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: build:linux
    - job: build:windows
    - job: build:macos
      optional: true
  before_script:
    - apk add --no-cache curl rsync openssh-client
  script:
    - |
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gestion-commerciale"
      for f in app/release/*.exe app/release/*.AppImage app/release/*.deb app/release/*.dmg app/release/*.zip app/release/*.blockmap app/release/latest*.yml; do
        [ -f "$f" ] || continue
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" "$BASE/${CI_COMMIT_TAG#v}/$(basename "$f")"
      done
    - |
      if [ -z "${GC_DEPLOY_HOST:-}" ]; then echo "GC_DEPLOY_HOST absent : pas de publication des mises à jour"; exit 0; fi
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      cp "$GC_DEPLOY_SSH_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      echo "$GC_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      SSH="ssh -i $HOME/.ssh/id_deploy"
      DEST="${GC_DEPLOY_USER}@${GC_DEPLOY_HOST}:${GC_DEPLOY_PATH}/"
      # Seuls les fichiers réellement produits (macOS est facultatif)
      INSTALLEURS=$(ls app/release/*.exe app/release/*.AppImage app/release/*.deb app/release/*.dmg \
                       app/release/*.zip app/release/*.blockmap 2>/dev/null || true)
      [ -n "$INSTALLEURS" ] && rsync -av -e "$SSH" $INSTALLEURS "$DEST"
      rsync -av -e "$SSH" app/release/latest*.yml "$DEST"
