# Copie de sos-cloud-server/src/proxy/proxy.schema.gql — état du commit 9cc3c79 (02/11/2026).
# À recopier à chaque évolution du cloud (demande D0, docs/12-DEMANDES-AGENT-CLOUD.md).
# Source de vérité des arguments des commandes de l agent (les réponses sont des JSON! : voir docs/12, D20 à D22).

# ─── Proxy GraphQL → PC Agent ────────────────────────────────────────────────
# Toutes les queries/mutations sont forwardées au PC agent de l'utilisateur.
# Les types retournés sont JSON (String) pour rester générique côté cloud.
# Le mobile parse le JSON dans ses propres modèles.

scalar JSON

# ─── Session ──────────────────────────────────────────────────────────────────
# Vérif légère d'accès (blocage compte + abonnement) SANS router vers l'agent.
# Utilisée par le watchdog du mobile pour réagir au blocage en temps réel.
extend type Query {
  sessionStatus: Boolean!
}

# ─── Dossiers ─────────────────────────────────────────────────────────────────
extend type Query {
  dossiers: JSON!
}

extend type Mutation {
  # Change le dossier actif (et le marque par défaut le cas échéant) → mutation d'état.
  switchDossier(name: String!, marquerDefaut: Boolean): JSON!
}

# ─── Clients ──────────────────────────────────────────────────────────────────
extend type Query {
  clients(search: String, actif: Boolean, segment: String, limit: Int, offset: Int, grille: JSON): JSON!
  client(id: Int!): JSON
  clientParCode(code: String!): JSON
  etatClient(code_cli: String!, date_debut: String, date_fin: String): JSON!
  soldeClient(code_cli: String!): JSON!
  etatClients(search: String, famille: String, sans_zeros: Boolean, limit: Int, offset: Int, grille: JSON): JSON!
  facturesNonReglees(code_cli: String!, type_doc: String): JSON!
  etatPaiementsClient(code_cli: String!, date_debut: String, date_fin: String): JSON!
}

extend type Mutation {
  createClient(input: JSON!): JSON!
  updateClient(id: Int!, input: JSON!): JSON!
  deleteClient(id: Int!): Boolean!
  setCreditInitialClient(code: String!, montant: Float!, date: String!): JSON!
}

# ─── Articles ─────────────────────────────────────────────────────────────────
extend type Query {
  articles(search: String, famille: String, type: String, depot: String, actif: Boolean, stock_alerte: Boolean, marge_negative: Boolean, limit: Int, offset: Int, grille: JSON): JSON!
  article(id: Int!): JSON
  articleParCode(code: String!): JSON
  articleParCodeBarre(code: String!): JSON
  stocks(search: String, depot: String, sous_minimum: Boolean, limit: Int, offset: Int): JSON!
  stockArticle(article_id: Int!): JSON
  # Lots / péremption (multilot)
  lots(article_id: Int!): JSON!
  lotPrix(lot_id: Int!): JSON!
  # Tarification
  tarifsArticle(code_article: String!): JSON!
  prixPourQte(code_article: String!, qte: Float!, type_prix: Int): JSON!
  promotions(article_id: Int!): JSON!
  nomenclature(article_id: Int!): JSON!
  # Codes-barres multiples
  barcodesArticle(article_id: Int!): JSON!
  # Alertes stock / marges
  alertesStock: JSON!
  articlesMargeNegative: JSON!
}

extend type Mutation {
  createArticle(input: JSON!): JSON!
  updateArticle(id: Int!, input: JSON!): JSON!
  deleteArticle(id: Int!): Boolean!
  addLot(article_id: Int!, n_lot: String!, date_peremption: String, qte: Float): JSON!
  deleteLot(lot_id: Int!): Boolean!
  # Simulation de prix (pmp/tva/marge → prix_ht/ttc), calcul pur côté agent
  calculerPrix(input: JSON!): JSON!
  # Procédure stockée de recalcul des quantités (lourde)
  recalculerStock: Boolean!
  recalculerStockArticle(article_id: Int!): JSON!
}

